<style>
/* Layout: a coastal-rental landing. Full-bleed sunset-over-the-pier photo under a see-through header, a three-step "plan your stay",
   a seafoam amenities band and a shoreline footer. Members get a side-rail workspace. */
:root {
  --bg: #f5f8f7;          /* salt-air white */
  --surface: #ffffff;
  --sunk: #e6f1ee;        /* seafoam mist */
  --ink: #0e2a3c;         /* deep Gulf navy */
  --muted: #587080;
  --line: #d3e1de;
  --accent: #0e2a3c;      /* navy buttons */
  --accent-ink: #ffffff;
  --sea: #8fcfbe;         /* the cabin's own seafoam */
  --sea-deep: #2f7f72;
  --sun: #d99a4e;         /* late-day sand gold */
  --sun-soft: #fbefdc;
  --ok: #2f7d4f;
  --warn: #b0562a;
  --glass: rgb(255 255 255 / .82);
  --glass-edge: rgb(255 255 255 / .6);
  --f-display: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --f-body: "Jost", "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
  --f-data: "DM Mono", ui-monospace, Menlo, monospace;
  --r: 8px;
  --wrap: 1760px;                 /* page width on big screens */
  --gutter: clamp(16px, 3.5vw, 48px); /* side margin */
  --shadow: 0 1px 2px rgb(14 42 60 / .05), 0 10px 30px rgb(14 42 60 / .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1822; --surface: #10222e; --sunk: #142d39; --ink: #e8f1ef; --muted: #9db4bd; --line: #223e4b;
    --accent: #8fcfbe; --accent-ink: #0a1822; --sea: #8fcfbe; --sea-deep: #8fcfbe; --sun: #e8b46e; --sun-soft: #33291a;
    --ok: #6cc28e; --warn: #e89a6c; --glass: rgb(10 24 34 / .78); --glass-edge: rgb(255 255 255 / .1);
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1822; --surface: #10222e; --sunk: #142d39; --ink: #e8f1ef; --muted: #9db4bd; --line: #223e4b;
  --accent: #8fcfbe; --accent-ink: #0a1822; --sea: #8fcfbe; --sea-deep: #8fcfbe; --sun: #e8b46e; --sun-soft: #33291a;
  --ok: #6cc28e; --warn: #e89a6c; --glass: rgb(10 24 34 / .78); --glass-edge: rgb(255 255 255 / .1);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 10px 30px rgb(0 0 0 / .25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.6 var(--f-body); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; line-height: 1.1; margin: 0; letter-spacing: .005em; }
h2 { font-size: clamp(1.9rem, 4vw, 2.5rem); }
h3 { font-size: 1.4rem; }
p { margin: 0; }
a { color: var(--sea-deep); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

/* header: solid on inner pages, see-through over the photo on the welcome page */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); transition: background .25s, border-color .25s, color .25s; }
.top-in { max-width: var(--wrap); margin: 0 auto; padding: 12px var(--gutter); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px 24px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand-word { display: grid; line-height: 1; }
.brand-word b { font: 600 1.45rem/1 var(--f-display); letter-spacing: .01em; }
.brand-word small { font: 500 .62rem/1.4 var(--f-body); letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.tabs { display: flex; gap: 2px; justify-content: center; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs a { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 8px 12px; font-size: .78rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--sun); }
.side-btn { border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 16px; font: 500 .74rem/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.side-btn svg { width: 14px; height: 14px; }
@media (max-width: 820px) {
  .top-in { grid-template-columns: 1fr auto; }
  .tabs { grid-column: 1 / -1; justify-content: flex-start; order: 3; margin-inline: -8px; }
}
body.home .top { position: fixed; left: 0; right: 0; top: 0; padding-top: env(safe-area-inset-top, 0px); background: transparent; border-bottom-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; color: #fff; }
body.home .top .brand-word small, body.home .top .tabs a { color: rgb(255 255 255 / .85); text-shadow: 0 1px 8px rgb(0 0 0 / .35); }
body.home .top .brand-word b { text-shadow: 0 1px 10px rgb(0 0 0 / .35); }
body.home .top .tabs a[aria-current="page"] { color: #fff; }
body.home .top .side-btn { border-color: rgb(255 255 255 / .85); color: #fff; background: rgb(10 30 45 / .2); }
body.home .top.solid { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom-color: var(--line); color: var(--ink); }
body.home .top.solid .brand-word small, body.home .top.solid .tabs a { color: var(--muted); text-shadow: none; }
body.home .top.solid .brand-word b { text-shadow: none; }
body.home .top.solid .tabs a[aria-current="page"] { color: var(--ink); }
body.home .top.solid .side-btn { border-color: var(--ink); color: var(--ink); background: transparent; }

main { max-width: var(--wrap); margin: 0 auto; padding: 40px var(--gutter) 72px; }
.panel { display: grid; gap: 22px; min-width: 0; }
.lede { color: var(--muted); max-width: 62ch; font-size: 1.05rem; font-weight: 300; }
.eyebrow { font: 500 .7rem/1.3 var(--f-body); text-transform: uppercase; letter-spacing: .24em; color: var(--sea-deep); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.grid2 > * { min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 12px 22px; border-radius: 999px; font: 500 .78rem/1.1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 7px 14px; font-size: .7rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.linkbtn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; font-size: .85rem; text-decoration: underline; text-underline-offset: 3px; }

label { display: grid; gap: 4px; font-weight: 500; font-size: .9rem; }
label .hint { font-weight: 400; color: var(--muted); font-size: .8rem; }
input[type=text], input[type=email], input[type=tel], input[type=date], input[type=number], input[type=url], input[type=password], textarea, select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 10px 12px; min-width: 0;
}
input:focus, textarea:focus, select:focus { border-color: var(--sea-deep); outline: none; box-shadow: 0 0 0 3px rgb(143 207 190 / .35); }
textarea { resize: vertical; min-height: 90px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.fields > * { min-width: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }

.notice { background: var(--sun-soft); border-radius: 8px; padding: 10px 14px; font-size: .9rem; }
.empty { color: var(--muted); padding: 22px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 500; z-index: 20; max-width: calc(100% - 32px); }

/* guest info lists */
.list-plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.list-plain li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.list-plain li:last-child { border-bottom: 0; }
.list-plain li::before { content: ""; width: 7px; height: 7px; margin-top: .55em; border-radius: 2px; background: var(--sun); flex: none; }
.edit-area { display: grid; gap: 10px; }

/* waiver */
.waiver-text { max-height: 420px; overflow: auto; background: var(--sunk); border-radius: 8px; padding: 6px 18px 16px; font-size: .9rem; }
.waiver-text p { margin: .6em 0; max-width: 72ch; }
.waiver-text ul { margin: .4em 0 .8em; padding-left: 1.3em; }
.waiver-text li { margin: .2em 0; }
.waiver-text .w-sec { font: 700 1.2rem/1.3 var(--f-display); margin: 1.3em 0 .3em; letter-spacing: .02em; }
.waiver-text .w-sub { font: 500 .72rem/1.3 var(--f-data); letter-spacing: .1em; color: var(--muted); margin: 1.1em 0 .2em; }
.sig-wrap { border: 1px dashed var(--muted); border-radius: 8px; background: var(--surface); position: relative; }
.sig-wrap canvas { display: block; width: 100%; height: 150px; touch-action: none; cursor: crosshair; }
.sig-wrap .base { position: absolute; left: 16px; right: 16px; bottom: 34px; border-bottom: 1px solid var(--line); pointer-events: none; }
.sig-wrap .x { position: absolute; left: 16px; bottom: 38px; font-family: var(--f-display); color: var(--muted); pointer-events: none; }

/* members gate */
.gate { max-width: 420px; margin: 40px auto; display: grid; gap: 14px; text-align: left; }

/* guest book */
.post { display: grid; gap: 8px; }
.post-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.post-head strong { font-family: var(--f-display); font-size: 1.3rem; }
.tag { font: 500 .7rem/1 var(--f-data); text-transform: uppercase; letter-spacing: .08em; padding: 4px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.tag.fish { background: var(--sun-soft); color: var(--ink); }
.meta { color: var(--muted); font-size: .82rem; }
.catch { display: flex; flex-wrap: wrap; gap: 6px 16px; font: .82rem/1.4 var(--f-data); color: var(--muted); }
.catch b { color: var(--ink); font-weight: 500; }
.post-body { white-space: pre-wrap; }
.ck-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.ck-grid h3 { color: var(--sea-deep); }
.ck-bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; }
.ck-bar span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.rec-years { display: flex; flex-wrap: wrap; gap: 8px; }
.rec-years button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--muted); }
.rec-years button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
.rec-grid h3 { color: var(--sea-deep); }
.rec-lead { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rec-lead img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: zoom-in; }
.rec-big { font: 600 1.6rem/1 var(--f-display); color: var(--ink); }
.rec-rows { list-style: none; margin: 0; padding: 0; counter-reset: r 1; }
.rec-rows li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .92rem; counter-increment: r; }
.rec-rows li::before { content: counter(r); color: var(--muted); font-size: .8rem; width: 16px; flex: none; }
.rec-rows li:last-child { border-bottom: 0; }
.map-place { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
.map-place strong { font-weight: 600; }
.list-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px 32px; }
.list-groups h3 { margin: 0 0 6px; font-size: 1.15rem; color: var(--sea-deep); }
.cp-strip { display: flex; flex-wrap: wrap; gap: 8px; }
.cp-thumb { position: relative; padding: 0; border: 0; width: 92px; height: 92px; border-radius: 8px; overflow: hidden; background: var(--sunk); cursor: zoom-in; flex: none; }
.cp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cp-x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(8 26 38 / .75); color: #fff; font-size: .8rem; line-height: 22px; text-align: center; cursor: pointer; }
.cond-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.cond-card { display: grid; gap: 10px; align-content: start; }
.cond-card h3 { margin: 0; }
.spots-form { display: grid; gap: 10px; }
.spot-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 10px; }
.spot-row label + label { color: var(--muted); }
@media (max-width: 640px) { .spot-row { grid-template-columns: 1fr; gap: 6px; padding-bottom: 8px; border-bottom: 1px solid var(--line); } }
.spots { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .92rem; }
.spots li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: baseline; }
.spot-notes { grid-column: 2; color: var(--muted); }
.kind-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.kind-switch button { border: 0; background: var(--surface); padding: 8px 16px; cursor: pointer; color: var(--muted); font-size: .9rem; }
.kind-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.g-links { list-style: none; margin: 0; padding: 0; display: grid; }
.g-links li + li { border-top: 1px solid var(--line); }
.g-links button { width: 100%; display: flex; align-items: baseline; gap: 12px; padding: 12px 2px; border: 0; background: none; cursor: pointer; text-align: left; font: 500 1.2rem/1.3 var(--f-display); color: var(--sea-deep); }
.g-links button span:first-child { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.g-links button:hover span:first-child { color: var(--ink); }
.g-links .g-who { font: .9rem var(--f-body); color: var(--muted); }
.g-links .count { margin-left: auto; font: .85rem var(--f-body); color: var(--muted); }

/* checklists */
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
.items li:last-child { border-bottom: 0; }
.items input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.items .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.items li.done .txt { color: var(--muted); text-decoration: line-through; }
.items .who { color: var(--muted); font-size: .78rem; }
.count { font: 500 .8rem var(--f-data); color: var(--muted); }

/* waivers table */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 .72rem var(--f-data); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
td.num { font-variant-numeric: tabular-nums; font-family: var(--f-data); font-size: .82rem; }
td img { height: 34px; background: #fff; border-radius: 4px; }

.cal-hero { display: grid; gap: 12px; }

/* welcome landing */
.hero { position: relative; min-height: clamp(560px, 92vh, 980px); display: flex; align-items: flex-end; color: #fff;
  background: #d9692e url("pier.jpg") 59% 52% / cover no-repeat; }
.hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(8 24 36 / .35) 0%, rgb(8 24 36 / 0) 22%, rgb(8 24 36 / 0) 62%, rgb(8 24 36 / .45) 100%); }
.hero-in { position: relative; width: 100%; max-width: var(--wrap); margin: 0 auto; padding: 0 var(--gutter) 40px; }
.hero-card { max-width: 460px; display: grid; gap: 8px; padding: 16px 20px; border-radius: 10px; background: rgb(8 26 38 / .2); border: 1px solid rgb(255 255 255 / .25);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); text-shadow: 0 1px 8px rgb(0 0 0 / .45); }
.hero-kicker { font: 500 .7rem/1 var(--f-body); letter-spacing: .3em; text-transform: uppercase; color: var(--sea); }
.hero-title { font-size: clamp(2rem, 5vw, 3rem); line-height: 1; font-weight: 600; text-wrap: balance; }
.hero-title span { display: block; font-style: italic; font-weight: 500; font-size: .5em; letter-spacing: .01em; margin-bottom: .2em; color: rgb(255 255 255 / .9); }
.hero-text { font-size: .92rem; font-weight: 400; max-width: 46ch; color: #fff; line-height: 1.5; }
.hero .btn { padding: 9px 16px; font-size: .68rem; text-shadow: none; }
.hero .btn.light { background: #fff; border-color: #fff; color: #0e2a3c; }
.hero .btn.clear { background: transparent; border-color: rgb(255 255 255 / .8); color: #fff; }
@media (max-width: 520px) { .hero { background-position: 35% 30%; } .hero-card { padding: 14px 16px; } .hero-in { padding-bottom: 16px; } .hero-text { font-size: .86rem; } }

body.home main { padding-top: 64px; }
.sec-head { display: grid; gap: 8px; max-width: 640px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.steps a { display: grid; gap: 10px; height: 100%; padding: 26px 24px; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
.steps a:hover { transform: translateY(-3px); }
.step-n { font: italic 600 2.6rem/1 var(--f-display); color: var(--sun); }
.steps .go { margin-top: auto; font: 500 .72rem/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; color: var(--sea-deep); }

.band { width: 100vw; margin-left: calc(50% - 50vw); background: var(--sunk); padding-block: 56px; margin-block: 24px; }
.band-in { max-width: var(--wrap); margin: 0 auto; padding-inline: var(--gutter); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .band-in { grid-template-columns: 1fr; } }
.amen { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 28px; }
.amen li { display: flex; gap: 12px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
.amen li::before { content: ""; width: 14px; height: 6px; flex: none; border-radius: 3px; background: var(--sea); transform: translateY(-2px); }
.home-tools { display: flex; justify-content: flex-end; }

/* footer */
.foot { color: #dfeeea; background: #0e2a3c; margin-top: 24px; }
.foot svg { display: block; width: 100%; height: 34px; background: var(--bg); }
.foot-in { max-width: var(--wrap); margin: 0 auto; padding: 28px var(--gutter) calc(36px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: 10px 32px; align-items: baseline; justify-content: space-between; }
.foot-word { font: 600 1.6rem/1 var(--f-display); color: #fff; }
.foot-tag { font: italic 500 1.35rem/1 var(--f-display); color: #8fcfbe; }

  waiverOrg: "Baffin Bay PC1409, LLC",
  waiverText: "1. NATURE OF THE PROPERTY AND ACTIVITIES\n\nI understand that I am entering and using a remote fishing cabin/camp and related facilities associated with Baffin Bay PC1409, LLC (“Baffin Bay PC1409”).\n\nI understand that the cabin/camp is located on property owned by the State of Texas and that access to and use of the property may involve boating, docks, piers, walkways, fishing, swimming or water exposure, electrical equipment, generators, appliances, tools, cooking equipment, and other activities and equipment commonly associated with a remote fishing camp.\n\nI understand that the property and facilities are not a hotel, resort, commercial lodging establishment, or continuously supervised facility.\n\n2. ACKNOWLEDGMENT OF RISKS\n\nI understand that visiting, accessing, and using the cabin/camp and surrounding property involves inherent and other risks that can result in property damage, serious bodily injury, illness, permanent disability, drowning, electrocution, or death.\n\nI acknowledge that these risks include, but are not limited to:\n\nBOAT, DOCK AND WATER HAZARDS\n\n- Boarding or exiting boats at the dock;\n- Differences in height or movement between a boat and dock;\n- Boats moving unexpectedly because of wind, waves, wakes, tides, currents, or passenger movement;\n- Slipping, tripping, or falling while boarding or exiting a vessel;\n- Slipping, tripping, or falling on docks, decks, piers, stairs, ramps, walkways, or other surfaces;\n- Wet, slippery, uneven, deteriorated, obstructed, or unstable surfaces;\n- Falling from a dock, boat, pier, walkway, or shoreline into the water;\n- Drowning or near-drowning;\n- Contact with boats, engines, propellers, anchors, lines, cleats, pilings, ladders, or other marine equipment;\n- Strong winds, waves, wakes, tides, currents, storms, lightning, and changing weather conditions;\n- Submerged or partially submerged objects; and\n- Marine animals, fish, insects, snakes, stingrays, jellyfish, and other wildlife.\n\nELECTRICAL HAZARDS\n\nI specifically understand that the presence of electricity in or near a marine environment creates potentially serious hazards.\n\nThese hazards may include:\n\n- Electrical shock or electrocution;\n- Electrical wiring, outlets, switches, extension cords, lighting, electrical panels, breakers, transformers, generators, batteries, chargers, pumps, motors, and electrical appliances;\n- Electrical equipment located in or near wet or damp areas;\n- Equipment malfunction or electrical faults;\n- Damage, deterioration, corrosion, improper connections, or unexpected failure of electrical equipment; and\n- Electrical equipment, systems, modifications, or installations installed or maintained at the cabin.\n\nI UNDERSTAND THAT ELECTRICITY IN OR AROUND WATER CAN CAUSE SERIOUS INJURY OR DEATH.\n\nCABIN, EQUIPMENT AND APPLIANCE HAZARDS\n\nI understand that the cabin and camp may contain equipment and appliances that present risks, including:\n\n- Cooking appliances, grills, burners, stoves, ovens, refrigerators, freezers, heaters, and other appliances;\n- Generators and associated electrical or fuel systems;\n- Propane, gasoline, diesel fuel, batteries, and other combustible materials;\n- Hot surfaces, flames, steam, cooking oil, and hot liquids;\n- Carbon monoxide;\n- Tools, knives, fishing equipment, hooks, lines, and other sharp objects;\n- Pumps, motors, mechanical equipment, and moving parts;\n- Furniture, stairs, steps, ladders, doors, decking, flooring, and other structures;\n- Fire, explosion, burns, cuts, falls, electrical shock, or other injuries associated with such equipment or facilities; and\n- Equipment or appliances installed, modified, maintained, or used by members or other persons.\n\nI understand that this list cannot identify every possible hazard associated with the property or activities.\n\n3. VOLUNTARY PARTICIPATION AND ASSUMPTION OF RISK\n\nI voluntarily choose to enter, visit, stay at, and participate in activities at or associated with Baffin Bay PC1409 with knowledge of the risks described above.\n\nTO THE FULLEST EXTENT PERMITTED BY APPLICABLE LAW, I KNOWINGLY AND VOLUNTARILY ASSUME THE INHERENT AND OTHER RISKS ASSOCIATED WITH ACCESSING, VISITING, STAYING AT, AND USING THE CABIN, DOCKS, BOATS, FACILITIES, EQUIPMENT, APPLIANCES, AND SURROUNDING PROPERTY, INCLUDING THE RISK OF SERIOUS BODILY INJURY, DROWNING, ELECTROCUTION, PERMANENT DISABILITY, AND DEATH.\n\n4. RELEASE AND WAIVER OF LIABILITY\n\nTO THE FULLEST EXTENT PERMITTED BY APPLICABLE LAW, I RELEASE AND WAIVE CLAIMS AGAINST BAFFIN BAY PC1409, LLC, ITS MEMBERS, MANAGERS, OWNERS, OFFICERS, EMPLOYEES, AGENTS, REPRESENTATIVES, INVITING MEMBERS, AND INSURERS (COLLECTIVELY, THE “RELEASED PARTIES”) FOR PERSONAL INJURY, DEATH, OR PROPERTY DAMAGE ARISING FROM OR RELATED TO MY ACCESS TO, PRESENCE AT, OR USE OF THE CABIN, CAMP, DOCKS, BOATS, FACILITIES, EQUIPMENT, APPLIANCES, OR SURROUNDING PROPERTY, INCLUDING CLAIMS ARISING FROM THE ORDINARY NEGLIGENCE OF A RELEASED PARTY, TO THE EXTENT SUCH CLAIMS MAY LAWFULLY BE RELEASED.\n\nThis release is intended to include, to the fullest extent permitted by applicable law, injuries associated with:\n\n- Boarding or exiting a boat;\n- Slipping, tripping, or falling on a dock, pier, deck, walkway, stairs, or cabin floor;\n- Falling into the water;\n- Drowning or near-drowning;\n- Electrical shock or electrocution;\n- Use or malfunction of electrical systems or equipment;\n- Generators, batteries, chargers, pumps, and related equipment;\n- Cooking equipment, grills, appliances, and other cabin equipment;\n- Fire, burns, carbon monoxide, or fuel-related hazards;\n- Fishing and boating activities; and\n- Other conditions or equipment located at or associated with the cabin or camp.\n\nThis release does not waive claims that cannot legally be waived under applicable law.\n\n5. GUEST RESPONSIBILITIES AND SAFETY RULES\n\nAs a condition of being a guest, I agree to exercise reasonable care for my own safety and the safety of others.\n\nI agree to:\n\n- Use caution while boarding and exiting boats;\n- Use available handrails, handholds, ladders, and other safety equipment as appropriate;\n- Keep docks, walkways, stairs, and exits reasonably clear;\n- Use particular caution on wet or slippery surfaces;\n- Wear appropriate footwear around the cabin, dock, and boats;\n- Wear a personal flotation device when required by law, requested by a vessel operator, or appropriate for conditions;\n- Stay clear of boat propellers and engines;\n- Not enter restricted electrical, mechanical, generator, or equipment areas unless authorized;\n- Not modify, repair, disconnect, bypass, or otherwise alter electrical or mechanical equipment;\n- Not operate equipment or appliances that I do not understand how to operate safely;\n- Immediately report any apparent electrical problem, damaged equipment, unsafe condition, or other hazard to a member of Baffin Bay PC1409;\n- Use reasonable caution around grills, cooking equipment, generators, fuel, batteries, and other equipment;\n- Follow reasonable safety instructions given by members or persons responsible for boats, equipment, or the property; and\n- Refrain from reckless or dangerous behavior.\n\n6. BOAT OPERATOR’S AUTHORITY\n\nWhenever I am aboard a boat traveling to, from, or in connection with the camp, I understand that the person operating or captaining that vessel is in charge of the vessel and has final authority concerning its safe operation.\n\nI agree to promptly follow the boat operator’s instructions concerning boarding, exiting, seating, movement aboard the vessel, personal flotation devices, weather conditions, navigation, emergency procedures, and other safety matters.\n\nI understand that boarding and exiting a boat at a dock can be particularly hazardous because the boat and dock may move independently and unexpectedly.\n\n7. ALCOHOL AND IMPAIRMENT\n\nI understand that consuming alcohol can substantially increase the risks associated with docks, boats, water, stairs, cooking equipment, electrical equipment, and other activities at the camp.\n\nI accept responsibility for my own consumption and conduct and agree not to operate boats, electrical equipment, generators, vehicles, or other potentially hazardous equipment while impaired.\n\n8. MEDICAL EMERGENCIES AND REMOTE LOCATION\n\nI understand that the cabin/camp may be located some distance from hospitals, emergency medical services, law enforcement, fire departments, or other emergency services.\n\nEmergency response and transportation may therefore take longer than they would in an urban location.\n\nIf I become injured or ill and am unable to make decisions for myself, I authorize reasonable emergency medical assistance to be requested on my behalf.\n\nI understand that I am responsible for medical expenses incurred on my behalf except as otherwise required by applicable law.\n\n9. PERSONAL PROPERTY\n\nI understand that Baffin Bay PC1409 is not responsible for safeguarding my personal belongings.\n\nTo the extent permitted by law, I accept the risk of loss or damage to personal property resulting from water, weather, theft, fire, equipment failure, boating activities, or other conditions associated with the camp.\n\n10. APPLICABLE LAW AND SEVERABILITY\n\nThis agreement is intended to be interpreted and enforced in accordance with applicable Texas law and, when applicable, federal maritime law.\n\nIf any provision of this agreement is determined to be invalid or unenforceable, the remaining provisions shall remain effective to the fullest extent permitted by law.\n\n11. GUEST ACKNOWLEDGMENT\n\nI ACKNOWLEDGE THAT I HAVE READ THIS AGREEMENT CAREFULLY AND UNDERSTAND IT.\n\nI UNDERSTAND THAT VISITING AND USING THE BAFFIN BAY PC1409 CABIN, DOCKS, BOATS, EQUIPMENT, APPLIANCES, AND RELATED FACILITIES INVOLVES RISKS THAT INCLUDE SERIOUS INJURY, DROWNING, ELECTROCUTION, PERMANENT DISABILITY, AND DEATH.\n\nI UNDERSTAND THAT THIS AGREEMENT CONTAINS AN ASSUMPTION OF RISK AND A RELEASE AND WAIVER OF CERTAIN LEGAL RIGHTS, INCLUDING CERTAIN CLAIMS ARISING FROM ORDINARY NEGLIGENCE.\n\nI voluntarily agree to these terms as a condition of entering and using the property and facilities associated with Baffin Bay PC1409, LLC.",

/* ---------- routing ---------- */
function currentRoute() {

}
function isMemberRoute(r) { return MEMBER_PAGES.some(p => p[0] === r); }

new ResizeObserver(([e]) => document.documentElement.style.setProperty("--top-h", Math.round(e.target.getBoundingClientRect().height) + "px")).observe($("#top"));

/* ---------- render ---------- */
function render() {

  $("#tabs").innerHTML = GUEST_PAGES.map(([id, label]) => `<a href="#${id}" ${id === r ? 'aria-current="page"' : ""}>${id === "welcome" ? "Home" : label}</a>`).join("");
  const home = r === "welcome" && S.editing !== "welcome";
  $("#hero").hidden = !home;
  document.body.classList.toggle("home", home);
  onScroll();
  $("#hero-text").textContent = S.site.welcome;
  const main = $("#main");
  if (member && !S.unlocked) { main.innerHTML = gateView(); bindGate(); return; }
  const views = { welcome: welcomeView, waiver: waiverView, bring: bringView, amenities: amenitiesView, location: locationView,
    guestbook: guestbookView, records: recordsView, checklists: checklistsView, conditions: conditionsView, photos: photosView, groceries: groceriesView, todo: todoView, calendar: calendarView, contacts: contactsView, waivers: waiversView };
  // preserve in-progress form inputs across live re-renders
  const keep = {};
  main.querySelectorAll("input[id], textarea[id], select[id]").forEach(el => { if (el.type !== "checkbox" && el.type !== "file") keep[el.id] = el.value; });
  const focusId = document.activeElement?.id;
  main.innerHTML = member
    ? `<div class="m-layout"><nav class="m-side" aria-label="Members pages"><p class="eyebrow">Members</p>${MEMBER_PAGES.map(([id, label]) => `<a href="#${id}" ${id === r ? 'aria-current="page"' : ""}>${label}</a>`).join("")}<button class="linkbtn" id="lock">Lock members area</button></nav><section class="panel">${views[r]()}</section></div>`
    : `<section class="panel">${views[r]()}</section>`;
  if (member) { const nav = $(".m-side"), cur = nav.querySelector("[aria-current]"); if (cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - (nav.clientWidth - cur.offsetWidth) / 2; }
  if (member) $("#lock").onclick = () => { fbAuth.signOut(); go("welcome"); };
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el && el.dataset.fresh == null) el.value = v; });
  if (focusId) document.getElementById(focusId)?.focus();
  binders[r]?.();
}

/* ---------- editable guest-info block (members can edit when unlocked) ---------- */
function editBtn(key) {

}
function listEditor(key, label) {

  return `<div class="card edit-area">

}
function bindEditing() {
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { S.editing = b.dataset.edit; render(); });
  document.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => { S.editing = null; render(); });
  document.querySelectorAll("[data-save]").forEach(b => b.onclick = async () => {
    const key = b.dataset.save;
    const patch = {};
    if (key === "location") {
      patch.address = $("#ed-address").value.trim();
      patch.directions = $("#ed-directions").value.trim();
      patch.mapUrl = $("#ed-mapUrl").value.trim();
      patch.rampName = $("#ed-rampName").value.trim();

      patch.waiverTitle = $("#ed-waiverTitle").value.trim() || DEFAULT_SITE.waiverTitle;
      patch.waiverText = $("#ed-waiverText").value.trim();
    } else if (key === "calendar") {
      patch.calendarUrl = $("#ed-calendarUrl").value.trim();
      patch.calendarNote = $("#ed-calendarNote").value.trim();
    } else if (key === "guestlist") {
      patch.guestListUrl = $("#ed-guestListUrl").value.trim();

      patch.spareKey = $("#ed-spareKey").value.trim();

      patch.welcome = $("#ed-welcome").value.trim();

async function saveSite(patch) {
  if (!needDb()) return;
  const next = { ...S.site, ...patch, updatedAt: Date.now() };
  try { await S.db.doc("config/site").set(next); S.site = next; S.editing = null; render(); toast("Saved"); }

const isHeading = i => /:\s*$/.test(i);

function listGroups(items) {

binders.amenities = () => {
  bindEditing();

  const f = $("#am-file");
  if (f) f.onchange = async e => {
    const files = [...e.target.files]; e.target.value = "";
    if (!files.length || !needDb()) return;
    const st = $("#am-status"); let done = 0;
    for (const file of files) {
      st.textContent = `Adding photo ${done + 1} of ${files.length}…`;
      try {
        const im = await loadImage(file);
        const big = shrink(im, 1400, 0.78, 168000), th = shrink(im, 480, 0.68, 40000);
        await S.db.collection("interior").add({ image: big.url, thumb: th.url, caption: "", by: myName(), createdAt: Date.now() });
        done++;
      } catch (ex) { st.textContent = ex?.code ? errMsg(ex) : `Couldn't read ${file.name}. Try a JPEG or PNG.`; return; }
    }
    st.textContent = ""; toast(done === 1 ? "Photo added" : `${done} photos added`);
  };
  const lb = $("#am-lb"); if (!lb) return;
  const n = amenityShots().length;
  const close = () => { S.amLb = -1; document.removeEventListener("keydown", window.__amKey); render(); };
  const step = d => { S.amLb = (S.amLb + d + n) % n; render(); };
  document.removeEventListener("keydown", window.__amKey || (() => {}));
  window.__amKey = e => { if (e.key === "Escape") close(); if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); };
  document.addEventListener("keydown", window.__amKey);
  $("#am-close").onclick = close;
  lb.onclick = e => { if (e.target === lb || e.target.classList.contains("lb-stage")) close(); };
  $("#am-prev") && ($("#am-prev").onclick = () => step(-1));
  $("#am-next") && ($("#am-next").onclick = () => step(1));

}
/* light formatting for the waiver text: numbered sections, all-caps subheads, "- " bullets */
function formatWaiver(text) {
  const out = []; let list = null;
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trim();
    if (line.startsWith("- ")) { (list ||= []).push(`<li>${esc(line.slice(2))}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if (!line) continue;
    const letters = line.replace(/[^A-Za-z]/g, "");
    if (/^\d+\.\s/.test(line) && letters === letters.toUpperCase()) out.push(`<h4 class="w-sec">${esc(line)}</h4>`);
    else if (letters && letters === letters.toUpperCase() && line.length < 60) out.push(`<h5 class="w-sub">${esc(line)}</h5>`);
    else if (letters && letters === letters.toUpperCase()) out.push(`<p><strong>${esc(line)}</strong></p>`);
    else out.push(`<p>${esc(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}
let sigDirty = false;
binders.waiver = () => {
  bindEditing();
  const c = $("#sig"); if (!c) return;
  sigDirty = false;
  const ctx = c.getContext("2d");
  const size = () => { const r = c.getBoundingClientRect(); const d = window.devicePixelRatio || 1; c.width = r.width * d; c.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1a2a40"; };
  size();
  let drawing = false;
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  c.onpointerdown = e => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  c.onpointermove = e => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); sigDirty = true; };
  c.onpointerup = c.onpointercancel = () => drawing = false;

  $("#waiver-form").onsubmit = async e => {

function bindSlideshow() {

  if (S.photos.length > 1) new Image().src = S.photos[(S.slide + 1) % S.photos.length].image;

function loadImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("unreadable")); }; im.src = url; });
}
function shrink(im, edge, q, maxChars) {
  let e = edge, quality = q, out, w, h;
  for (;;) {
    const k = Math.min(1, e / Math.max(im.naturalWidth, im.naturalHeight));
    w = Math.round(im.naturalWidth * k); h = Math.round(im.naturalHeight * k);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(im, 0, 0, w, h);
    out = c.toDataURL("image/jpeg", quality);
    if (out.length <= maxChars || e < 500) return { url: out, w, h };
    if (quality > 0.62) quality -= 0.08; else e -= 150;
  }
}

/* Turn pasted text or a CSV into {category, text} items. Understands
   "Category:" header lines, indented or bulleted lines under a heading,
   "Category: a, b, c", and two-column CSV / tab rows (category, item). */
function parseList(raw, isCsv) {
  const out = [];
  const clean = s => s.replace(/^\s*(?:[-*•◦▪‣·○●]|\[[ xX]?\]|☐|☑|✓|✔|\d+[.)])\s*/, "").replace(/\s+/g, " ").trim();
  const lines = String(raw || "").replace(/\r/g, "").split("\n");
  if (isCsv || lines.some(l => l.includes("\t"))) {
    for (const line of lines) {
      if (!line.trim()) continue;
      const cols = (line.includes("\t") ? line.split("\t") : line.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(c => c.replace(/,$/, ""))).map(c => c.replace(/^"|"$/g, "").replace(/""/g, '"').trim());
      if (/^(category|item|meal)$/i.test(cols[0]) && out.length === 0) continue;
      const filled = cols.filter(Boolean);
      if (filled.length >= 2) out.push({ category: clean(filled[0]), text: clean(filled[1]) });
      else if (filled.length === 1) out.push({ category: "", text: clean(filled[0]) });
    }
    return out.filter(i => i.text);
  }
  let cat = "", lastPlain = -1, indentCat = false, groupMarked = false;
  for (const line of lines) {
    if (!line.trim()) { cat = ""; lastPlain = -1; indentCat = false; groupMarked = false; continue; }
    const indented = /^(\s{2,}|\t)/.test(line);
    const text = clean(line);
    if (!text) continue;
    const colon = text.match(/^([^:]{1,40}):\s*(.*)$/);
    if (colon && !/^https?$/i.test(colon[1])) {
      const name = colon[1].trim();
      if (colon[2]) { colon[2].split(/,|;/).map(clean).filter(Boolean).forEach(t => out.push({ category: name, text: t })); cat = ""; }
      else cat = name;
      lastPlain = -1; indentCat = false; groupMarked = false; continue;
    }
    if (indentCat && !indented) { cat = ""; indentCat = false; }
    if (indented && lastPlain >= 0 && !cat) { cat = out[lastPlain].text; out.splice(lastPlain, 1); lastPlain = -1; indentCat = true; }
    const marked = indented || /^\s*(?:[-*•◦▪‣·○●]|\[[ xX]?\]|☐|☑|\d+[.)])/.test(line);
    if (cat && groupMarked && !marked) { cat = ""; groupMarked = false; }
    if (cat) { if (marked) groupMarked = true; out.push({ category: cat, text }); continue; }
    out.push({ category: "", text }); lastPlain = out.length - 1;
  }
  return out;
}

    catch (ex) { toast(errMsg(ex)); return false; }
  }
  return true;
}

        const g = list.filter(c => c.group === k);
        return `<div class="ip-group"><div class="ip-head"><h3><span class="ip-dot ip-${k}"></span>${l}</h3><button class="linkbtn" data-ct-add="${k}">Add to ${l}</button></div>
          ${g.length ? `<div class="ct-list">${g.map(ctCard).join("")}</div>` : `<p class="meta">No one added yet.</p>`}</div>`;
      }).join("")}
    </div>
    ${editing ? "" : contactForm(null)}
    ${list.length ? `<div class="row"><button class="linkbtn" id="ct-copy-all">Copy all contacts as text</button></div>` : ""}`;
}
binders.contacts = () => {
  bindEditing();
  document.querySelectorAll("[data-ct-add]").forEach(b => b.onclick = () => { S.ctGroup = b.dataset.ctAdd; S.contactEdit = null; render(); const f = $("#ct-form"); if (f) { f.scrollIntoView({ behavior: "smooth", block: "start" }); $("#ct-name").focus({ preventScroll: true }); } });
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy, "Copied"));
  document.querySelectorAll("[data-ct-edit]").forEach(b => b.onclick = () => { S.contactEdit = b.dataset.ctEdit; S.ctGroup = (S.contacts.find(c => c.id === b.dataset.ctEdit) || {}).group || ""; render(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-ct-del]").forEach(b => b.onclick = () => confirmDelete(b, "contacts", b.dataset.ctDel));
  $("#ct-group").onchange = e => { S.ctGroup = e.target.value; };
  const cancel = $("#ct-cancel"); if (cancel) cancel.onclick = () => { S.contactEdit = null; S.ctGroup = ""; render(); };
  const all = $("#ct-copy-all"); if (all) all.onclick = () => copyText(sortContacts(S.contacts).map(c => [c.name + (c.role ? " (" + c.role + ")" : "") + (c.group ? " [" + CT_GROUPS.find(([k]) => k === c.group)[1] + "]" : ""), c.cell, c.email, c.address, c.note].filter(Boolean).join(" · ")).join("\n"), "Contacts copied");
  $("#ct-form").onsubmit = async e => {
    e.preventDefault();
    const rec = { name: $("#ct-name").value.trim(), cell: $("#ct-cell").value.trim(), email: $("#ct-email").value.trim(), role: $("#ct-role").value.trim(), group: $("#ct-group").value, address: $("#ct-address").value.trim(), note: $("#ct-note").value.trim() };
    if (!rec.name) { toast("Add a name."); $("#ct-name").focus(); return; }
    if (!rec.cell && !rec.email) { toast("Add a cell phone or an email."); return; }
    if (!needDb()) return;
    try {
      if (S.contactEdit) { await S.db.doc("contacts/" + S.contactEdit).update(rec); S.contactEdit = null; S.ctGroup = ""; toast("Contact saved"); render(); }
      else { await S.db.collection("contacts").add({ ...rec, createdAt: Date.now() }); ["ct-name", "ct-cell", "ct-email", "ct-role", "ct-address", "ct-note"].forEach(id => $("#" + id).value = ""); S.ctGroup = ""; toast("Contact added"); render(); }
    } catch (ex) { toast(errMsg(ex)); }
  };
};

/* ---------- calendar ---------- */
function calendarView() {
  const s = S.site;
  if (S.editing === "calendar") return `<h2>Calendar</h2><div class="card edit-area">
    <label for="ed-calendarUrl">Shared calendar link<span class="hint">From Google Calendar: Settings, your cabin calendar, then copy its public or shareable link.</span></label>
    <input type="url" id="ed-calendarUrl" data-fresh value="${esc(s.calendarUrl)}" placeholder="https://calendar.google.com/…">
    <label for="ed-calendarNote">Note for members</label><textarea id="ed-calendarNote" data-fresh rows="3">${esc(s.calendarNote)}</textarea>
    <div class="row"><button class="btn" data-save="calendar">Save</button><button class="btn ghost" data-cancel>Cancel</button></div></div>`;
  return `<div><p class="eyebrow">Members</p><h2>Calendar</h2></div>
    <div class="card cal-hero">
      <p>${esc(s.calendarNote)}</p>
      ${s.calendarUrl ? `<div class="row"><a class="btn" href="${esc(s.calendarUrl)}" target="_blank" rel="noopener" style="text-decoration:none">Open the cabin calendar</a></div>`
        : `<p class="notice">No calendar linked yet. Add the shared calendar's link so everyone can find it here.</p>`}
    </div>
    <button class="linkbtn" data-edit="calendar" style="justify-self:start">${s.calendarUrl ? "Change calendar link" : "Add calendar link"}</button>`;
}
binders.calendar = bindEditing;

/* ---------- signed waivers ---------- */
function waiversView() {
  const q = ($("#wv-q")?.value || "").toLowerCase();
  const list = S.waivers.filter(w => !q || [w.name, w.email, w.minors, w.invitingMember].join(" ").toLowerCase().includes(q));
  return `<div class="row"><div><p class="eyebrow">Members</p><h2>Signed Waivers</h2></div><span class="spacer"></span>
      ${S.downloads ? `<button class="btn ghost" id="wv-export" ${S.waivers.length ? "" : "disabled"}>Export spreadsheet (CSV)</button>` : ""}</div>
    <p class="lede"><span class="count">${S.waivers.length}</span> on file. Every waiver guests sign on the site lands here.</p>
    <input type="text" id="wv-q" placeholder="Search by name or email" aria-label="Search waivers">
    ${list.length ? `<div class="tablewrap card" style="padding:4px 8px"><table>
      <thead><tr><th>Name</th><th>Visit</th><th>Invited by</th><th>Contact</th><th>Emergency</th><th>Minors</th><th>Signed</th><th>Signature</th></tr></thead>
      <tbody>${list.map(w => `<tr><td><strong>${esc(w.name)}</strong></td>
        <td>${esc(w.visitDate || "")}</td>
        <td>${esc(w.invitingMember || "")}</td>
        <td>${esc(w.email)}${w.phone ? `<br><span class="meta">${esc(w.phone)}</span>` : ""}</td>
        <td>${esc(w.emergency || "")}${w.emergencyPhone ? `<br><span class="meta">${esc(w.emergencyPhone)}</span>` : ""}</td>
        <td>${esc(w.minors || "")}</td>
        <td class="num">${esc(fmtDT(w.signedAt))}</td>
        <td>${w.signature ? `<img src="${esc(w.signature)}" alt="Signature of ${esc(w.name)}">` : ""}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="empty">${S.waivers.length ? "No waivers match that search." : "No waivers signed yet. Share the Sign waiver page with your guests."}</p>`}`;
}
binders.waivers = () => {
  const q = $("#wv-q");
  q.oninput = () => { const pos = q.selectionStart; render(); const n = $("#wv-q"); n.focus(); n.setSelectionRange(pos, pos); };
  const ex = $("#wv-export");
  if (ex) ex.onclick = async () => {
    const cols = ["name", "visitDate", "invitingMember", "address", "cityStateZip", "phone", "email", "emergency", "emergencyPhone", "minors", "guardianPhone", "signedAt"];
    const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const rows = [cols.join(","), ...S.waivers.map(w => cols.map(c => cell(c === "signedAt" ? new Date(w.signedAt).toISOString() : w[c])).join(","))];
    try { await S.downloads.save({ filename: "baffin-cabin-waivers.csv", data: rows.join("\n") }); } catch (e) { if (e?.code !== "cancelled") toast("The download didn't go through."); }
  };
};

/* ---------- boot ---------- */
render();
(() => {
  if (!window.firebase) return;
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.firestore();
  window.fbAuth = firebase.auth();
  S.db = db; S.canWrite = true;
  S.downloads = { save: async ({ filename, data }) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "text/csv" })); a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); } };
  const onErr = () => {};
  // re-render only the page that shows the changed data, so nobody loses a half-filled form
  const refresh = routes => { const r = currentRoute(); if (!S.editing && routes.includes(r) && !(r === "waiver" && sigDirty)) render(); };
  // guests can read these two; everything else is members only
  db.doc("config/site").onSnapshot(snap => { if (snap.exists) { S.site = { ...DEFAULT_SITE, ...snap.data() }; refresh(["welcome", "waiver", "bring", "amenities", "location", "calendar", "checklists", "contacts"]); } }, onErr);
  const sub = (coll, key, field, dir, routes) => db.collection(coll).orderBy(field, dir).onSnapshot(snap => {
    S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() })); refresh(routes);
  }, onErr);
  sub("interior", "interior", "createdAt", "asc", ["amenities"]);
  let subs = [];
  fbAuth.onAuthStateChanged(user => {
    subs.forEach(u => u()); subs = [];
    S.unlocked = !!user;
    if (user) subs = [
      sub("waivers", "waivers", "signedAt", "desc", ["waivers"]),
      sub("posts", "posts", "createdAt", "desc", ["guestbook", "todo"]),
      sub("groceries", "groceries", "createdAt", "asc", ["groceries"]),
      sub("groceryLists", "groceryLists", "createdAt", "desc", ["groceries"]),
      sub("todos", "todos", "createdAt", "asc", ["todo"]),
      sub("photos", "photos", "createdAt", "desc", ["photos"]),
      sub("records", "records", "createdAt", "desc", ["records"]),
      sub("catchPhotos", "catchPhotos", "createdAt", "asc", ["guestbook"]),
      sub("contacts", "contacts", "createdAt", "asc", ["contacts"])
    ];
    render();
  });
  render();
})();
</script>
